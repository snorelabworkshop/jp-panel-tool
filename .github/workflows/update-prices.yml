name: Update prices

on:
  schedule:
    - cron: '0 22 * * 0'   # 每週一 06:00（台北時間, UTC+8）
  workflow_dispatch:        # 也可手動觸發

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape tanakamusen prices
        run: node scripts/scrape.mjs
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update prices ($(date +%F))"
          git push
